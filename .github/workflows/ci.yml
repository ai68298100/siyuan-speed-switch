name: CI

# 每次 push / PR 都跑类型检查 + 构建 + 测试，坏改动在合入前暴露
on:
  push:
    branches:
      - main
      - master
      - dev/thispc-1002
      - 'dev/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 根据 package.json 的 packageManager 字段自动安装对应版本 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser smoke tests need an explicit Linux Chromium executable.
      - name: Install Chromium for browser smoke
        shell: bash
        run: |
          pnpm exec playwright install --with-deps chromium
          browser_path="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          test -x "$browser_path"
          wrapper_path="$RUNNER_TEMP/chromium-wrapper"
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "$browser_path" > "$wrapper_path"
          chmod +x "$wrapper_path"
          printf 'BROWSER_PATH=%s\n' "$wrapper_path" >> "$GITHUB_ENV"

      # 类型错误先行：tsc 比构建快，失败时省去后续步骤
      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Reproducible build audit
        run: pnpm repro:audit

      - name: Unit tests
        run: pnpm test

      - name: Smoke test
        run: pnpm test:smoke
