name: Release

# 推送 v* 标签时自动构建 package.zip 并发布到 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 根据 package.json 的 packageManager 字段自动安装对应版本 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser smoke tests need an explicit Linux Chromium executable.
      - name: Install Chromium for browser smoke
        shell: bash
        run: |
          pnpm exec playwright install --with-deps chromium
          browser_path="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          test -x "$browser_path"
          wrapper_path="$RUNNER_TEMP/chromium-wrapper"
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "$browser_path" > "$wrapper_path"
          chmod +x "$wrapper_path"
          # Keep the resolved executable visible for diagnostics, then run smoke
          # tests through the no-sandbox wrapper in the hosted Linux runner.
          printf 'BROWSER_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          printf 'BROWSER_PATH=%s\n' "$wrapper_path" >> "$GITHUB_ENV"

      - name: Verify tag version
        run: node scripts/release-version-preflight.cjs

      # Release verification is the same complete gate used locally, including
      # type, reproducibility, contract, compatibility, and smoke checks.
      - name: Complete local release gate
        run: pnpm verify:release

      # Archive checks run again on the clean-checkout artifact so release-only
      # size and manifest gates cannot silently skip.
      - name: Package integrity gate
        env:
          SW_REQUIRE_PACKAGE: "1"
        run: node --test tests/host/package-integrity.test.cjs tests/host/final-package-audit.test.cjs

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          generate_release_notes: true
