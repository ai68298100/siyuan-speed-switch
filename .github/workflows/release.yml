name: Release

# 推送 v* 标签时自动构建 package.zip 并发布到 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 根据 package.json 的 packageManager 字段自动安装对应版本 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package.zip
        run: pnpm build

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          generate_release_notes: true
