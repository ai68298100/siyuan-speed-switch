<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">LvSpeed Switch</title>
  <desc id="desc">Layered blue and cyan tabs with a lightning mark on a rounded white tile.</desc>
  <defs>
    <linearGradient id="tile" x1="28" y1="22" x2="132" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#f1f7ff"/>
    </linearGradient>
    <linearGradient id="tabBack" x1="30" y1="36" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2448f3"/>
      <stop offset="1" stop-color="#1a9dff"/>
    </linearGradient>
    <linearGradient id="tabMid" x1="38" y1="44" x2="124" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2377ff"/>
      <stop offset="1" stop-color="#20c7ef"/>
    </linearGradient>
    <linearGradient id="tabFront" x1="42" y1="58" x2="130" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2aaaff"/>
      <stop offset="1" stop-color="#63e2e8"/>
    </linearGradient>
    <linearGradient id="bolt" x1="68" y1="48" x2="101" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8ffff"/>
      <stop offset=".46" stop-color="#69e8f3"/>
      <stop offset="1" stop-color="#2767ff"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#4b74b8" flood-opacity=".14"/>
    </filter>
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2c83e8" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect x="18" y="18" width="124" height="124" rx="28" fill="url(#tile)" filter="url(#tileShadow)"/>
  <path d="M38 38h47l12 12v47a9 9 0 0 1-9 9H38a9 9 0 0 1-9-9V47a9 9 0 0 1 9-9Z" fill="url(#tabBack)" filter="url(#tabShadow)"/>
  <path d="M45 48h49l12 12v47a9 9 0 0 1-9 9H45a9 9 0 0 1-9-9V57a9 9 0 0 1 9-9Z" fill="url(#tabMid)" opacity=".94"/>
  <path d="M53 59h48l12 12v43a9 9 0 0 1-9 9H53a9 9 0 0 1-9-9V68a9 9 0 0 1 9-9Z" fill="url(#tabFront)" opacity=".9"/>
  <path d="m84 47-25 39h17l-9 31 30-45H80Z" fill="url(#bolt)" stroke="#fff" stroke-opacity=".8" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
