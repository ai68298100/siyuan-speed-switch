<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">LvSpeed Switch architecture</title>
  <desc id="desc">Six layers connect desktop, sidebar and mobile surfaces to shared navigation services, SiYuan integration, persistence and testable infrastructure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#667085"/>
    </marker>
    <style>
      .title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#101828}
      .subtitle{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}
      .label{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#344054;letter-spacing:0}
      .text{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1d2939}
      .small{font:400 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475467}
      .code{font:500 10px Consolas,Menlo,monospace;fill:#344054}
      .box{stroke-width:1.2;rx:7;ry:7}
      .arrow{stroke:#667085;stroke-width:1.3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="29" text-anchor="middle" class="title">LvSpeed Switch 0.16.10 - Runtime Architecture</text>
  <text x="480" y="48" text-anchor="middle" class="subtitle">One navigation model, three surface-specific interfaces, isolated async work</text>

  <rect x="32" y="70" width="896" height="90" fill="#eef6ff" stroke="#75a7d8" class="box"/>
  <text x="48" y="91" class="label">1  SURFACES</text>
  <rect x="55" y="105" width="255" height="38" fill="#ffffff" stroke="#75a7d8" class="box"/>
  <text x="182" y="121" text-anchor="middle" class="text">Desktop dialog / fullscreen</text>
  <text x="182" y="136" text-anchor="middle" class="small">large toolbar + panels + bottom/right actions</text>
  <rect x="352" y="105" width="255" height="38" fill="#ffffff" stroke="#75a7d8" class="box"/>
  <text x="479" y="121" text-anchor="middle" class="text">Right sidebar</text>
  <text x="479" y="136" text-anchor="middle" class="small">compact toolbar + responsive card grid</text>
  <rect x="649" y="105" width="255" height="38" fill="#ffffff" stroke="#75a7d8" class="box"/>
  <text x="776" y="121" text-anchor="middle" class="text">Mobile dialog</text>
  <text x="776" y="136" text-anchor="middle" class="small">touch sorting + stable first frame + actions</text>

  <path d="M480 160 V178" class="arrow"/>
  <rect x="32" y="181" width="896" height="76" fill="#f4f5f7" stroke="#98a2b3" class="box"/>
  <text x="48" y="202" class="label">2  SHARED ORCHESTRATION</text>
  <rect x="55" y="216" width="255" height="25" fill="#ffffff" stroke="#98a2b3" class="box"/>
  <text x="182" y="232" text-anchor="middle" class="code">registerSwitcherRefresh()</text>
  <rect x="352" y="216" width="255" height="25" fill="#ffffff" stroke="#98a2b3" class="box"/>
  <text x="479" y="232" text-anchor="middle" class="code">per-surface SearchSession</text>
  <rect x="649" y="216" width="255" height="25" fill="#ffffff" stroke="#98a2b3" class="box"/>
  <text x="776" y="232" text-anchor="middle" class="code">shared action execution</text>

  <path d="M480 257 V275" class="arrow"/>
  <rect x="32" y="278" width="896" height="104" fill="#eef8f1" stroke="#69a87a" class="box"/>
  <text x="48" y="299" class="label">3  NAVIGATION SERVICES</text>
  <rect x="49" y="315" width="158" height="48" fill="#ffffff" stroke="#69a87a" class="box"/>
  <text x="128" y="334" text-anchor="middle" class="text">Tabs + MRU</text>
  <text x="128" y="350" text-anchor="middle" class="small">group, sort, pin, open, close</text>
  <rect x="225" y="315" width="158" height="48" fill="#ffffff" stroke="#69a87a" class="box"/>
  <text x="304" y="334" text-anchor="middle" class="text">Favorites</text>
  <text x="304" y="350" text-anchor="middle" class="small">groups, ordering, batch actions</text>
  <rect x="401" y="315" width="158" height="48" fill="#ffffff" stroke="#69a87a" class="box"/>
  <text x="480" y="334" text-anchor="middle" class="text">Card search</text>
  <text x="480" y="350" text-anchor="middle" class="small">open tabs first, workspace next</text>
  <rect x="577" y="315" width="158" height="48" fill="#ffffff" stroke="#69a87a" class="box"/>
  <text x="656" y="334" text-anchor="middle" class="text">Quick actions</text>
  <text x="656" y="350" text-anchor="middle" class="small">built-in, dock, command, adapter</text>
  <rect x="753" y="315" width="158" height="48" fill="#ffffff" stroke="#69a87a" class="box"/>
  <text x="832" y="334" text-anchor="middle" class="text">Journal + panels</text>
  <text x="832" y="350" text-anchor="middle" class="small">daily note and dock navigation</text>

  <path d="M480 382 V400" class="arrow"/>
  <rect x="32" y="403" width="896" height="72" fill="#fff6e8" stroke="#d59b45" class="box"/>
  <text x="48" y="424" class="label">4  SIYUAN AND PLUGIN INTEGRATION</text>
  <rect x="55" y="438" width="190" height="23" fill="#ffffff" stroke="#d59b45" class="box"/>
  <text x="150" y="453" text-anchor="middle" class="code">getAllTabs / MobileTabs</text>
  <rect x="267" y="438" width="190" height="23" fill="#ffffff" stroke="#d59b45" class="box"/>
  <text x="362" y="453" text-anchor="middle" class="code">kernel document API</text>
  <rect x="479" y="438" width="190" height="23" fill="#ffffff" stroke="#d59b45" class="box"/>
  <text x="574" y="453" text-anchor="middle" class="code">Dock + plugin commands</text>
  <rect x="691" y="438" width="190" height="23" fill="#ffffff" stroke="#d59b45" class="box"/>
  <text x="786" y="453" text-anchor="middle" class="code">registerQuickAction()</text>

  <path d="M480 475 V493" class="arrow"/>
  <rect x="32" y="496" width="896" height="57" fill="#f7f1fc" stroke="#9b78b5" class="box"/>
  <text x="48" y="517" class="label">5  PERSISTENCE</text>
  <text x="160" y="517" class="small">8 validated storage keys, debounced writes, unload flush, import/export</text>
  <text x="54" y="538" class="code">sw_mru  sw_pinned  sw_favorites  sw_fav_groups  sw_fav_collapsed  sw_quick_actions  sw_settings  sw_thumb_cache</text>

  <path d="M480 553 V570" class="arrow"/>
  <rect x="32" y="573" width="896" height="31" fill="#f2f4f7" stroke="#98a2b3" class="box"/>
  <text x="48" y="593" class="label">6  TESTABLE INFRASTRUCTURE</text>
  <text x="224" y="593" class="code">util.js  search-session.js  quick-actions.js  constants.ts  types.ts  logger.ts  node:test  jsdom</text>
</svg>
